<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sector Not Found | Tactical Legends</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #030712;
            color: #00ff88;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2.5rem;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 255, 136, 0.35);
            border-radius: 14px;
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.15);
        }
        h1 {
            font-size: 2.75rem;
            margin-bottom: 0.5rem;
            color: #ff6b6b;
            letter-spacing: 1px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.75rem;
        }
        .btn {
            display: inline-block;
            background: #00ff88;
            color: #030712;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            margin: 0.5rem;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        .btn-sec {
            background: rgba(255, 255, 255, 0.08);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.35);
        }
        .btn-sec:hover {
            background: rgba(56, 189, 248, 0.15);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404 // SECTOR UNCHARTED</h1>
        <p>The coordinate or tactical deployment link you requested is currently offline or unmapped in the Oistarian archives.</p>
        <a href="/" class="btn">Return to Command Center</a>
        <a href="/trailer" class="btn btn-sec">Launch AI Trailer</a>
    </div>
</body>
</html>
